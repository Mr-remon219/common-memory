name: core-ci
on:
  push:
  pull_request:
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/verify.mjs
      - name: Verify packed consumer
        if: runner.os == 'Linux'
        run: npm run test:consumer
