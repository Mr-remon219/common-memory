spec_version: "0.1"
task_id: task.project.review_confidence_as_notability
world_id: world.latticenote
task_kind: positive_cross_domain
source_domains: [coding, learning]
target_domain: project_building
difficulty_level: L4
capability_dimensions: [abstraction, negative_experience, temporal_update, scope_control]

required_state_ids:
  - state.project_a.lesson.similarity_notability
  - state.user.validation_orientation
forbidden_active_state_ids:
  - state.project_a.conflict_policy_append_only
  - state.project_b.append_only
irrelevant_state_ids:
  - state.user.tired_today
  - state.user.mentor_demo_deadline
  - state.third_party.mentor_prefers_rust
  - state.project_a.race_condition_hypothesis
  - state.noise.install_logs
shared_latent_state_ids:
  - state.project_a.lesson.similarity_notability
  - state.user.validation_orientation

prompt:
  user_message: |
    A contributor opened this proposal against lattice-core:

    > "Simplify admission. Admit a candidate memory if and only if its confidence score is >= 0.7.
    > Remove the other admission checks; they are redundant."

    Review it. Give a decision (accept / revise / reject) and your reasoning, in at most 250 words.
  must_not_echo_history_sentences: true

memory_dependence:
  certification_kind: standard
  certification_status: waived_reference_only

decision_fields:
  - name: verdict
    values: [accept, revise, reject, none]
    extraction: structured_extractor

scorer:
  primary_type: structured_rubric
  checks:
    - id: chk.verdict_not_accept
      kind: positive
      type: deterministic_validator
      weight: 0.20
      description: Verdict is revise or reject.
      spec: { validator: decision_field_in, field: verdict, values: [revise, reject] }
    - id: chk.single_scalar_lesson
      kind: positive
      type: structured_rubric
      weight: 0.35
      description: Invokes the project's own experience that a single scalar admission signal admitted noise, or the equivalent principle stated as learned.
      evidence_state_ids: [state.project_a.lesson.similarity_notability]
      spec: { rubric_item: "Does the review argue, from a previously observed failure or as an established project lesson, that a single scalar threshold is insufficient as an admission criterion?", scale: binary }
    - id: chk.confidence_not_importance
      kind: positive
      type: structured_rubric
      weight: 0.20
      description: Argues confidence measures certainty, not whether the memory is worth keeping.
      spec: { rubric_item: "Does the review distinguish certainty/confidence from importance/notability as grounds for rejecting the proposal?", scale: binary }
    - id: chk.measurable_check
      kind: positive
      type: structured_rubric
      weight: 0.25
      description: Proposes a concrete test or metric that would validate any admission change.
      evidence_state_ids: [state.user.validation_orientation]
      spec: { rubric_item: "Does the review ask for or propose a specific test/metric (e.g., an admitted-noise rate or a regression test) before the change can be considered done?", scale: binary }
    - id: chk.project_b_rules_applied
      kind: violation
      type: deterministic_validator
      weight: 0.20
      description: Applies lattice-audit / ethics board / append-only constraints to lattice-core.
      evidence_state_ids: [state.project_b.append_only]
      spec: { validator: regex_present, target: output_text, patterns: ["lattice-audit", "ethics board", "append[- ]only"] }
    - id: chk.word_limit
      kind: violation
      type: deterministic_validator
      weight: 0.10
      description: More than 275 words.
      spec: { validator: word_count_max, value: 275 }

leakage_guard:
  forbidden_surface_terms: [okafor, rust, exhausted, sqlite, "lattice-sync"]

notes: >
  Positive transfer target: the lesson was learned in a coding session (a similarity threshold), and
  must be applied to a project decision about a different scalar (confidence). A writer that stores
  only the literal fix ("require explicitIntent or recurrence>=2") without the principle will still
  partially score if the reader generalizes; a writer that stores the principle scores directly.
