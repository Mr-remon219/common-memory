spec_version: "0.1"
task_id: task.learning.explain_salience_confidence
world_id: world.latticenote
task_kind: positive_cross_domain
source_domains: [learning, conversation, coding]
target_domain: learning
difficulty_level: L4
capability_dimensions: [abstraction, durable_retention, epistemic_calibration, scope_control]

required_state_ids:
  - state.user.explanation_style
  - state.user.misconception.salience_confidence
  - state.user.knowledge.embeddings
forbidden_active_state_ids: []
irrelevant_state_ids:
  - state.project_a.stack
  - state.project_a.no_default_export
  - state.project_a.race_condition_hypothesis
  - state.user.tired_today
  - state.user.mentor_demo_deadline
  - state.third_party.mentor_prefers_rust
  - state.noise.install_logs
shared_latent_state_ids:
  - state.user.explanation_style
  - state.user.misconception.salience_confidence

prompt:
  user_message: |
    I'm drafting the background chapter of my thesis. Explain to me the difference between the
    salience of a memory record and the confidence of a memory record, and how each should affect
    recall ranking. Under 300 words.
  must_not_echo_history_sentences: true

memory_dependence:
  certification_kind: standard
  certification_status: waived_reference_only

decision_fields:
  - name: explanation_order
    values: [formula_first, example_first, none]
    extraction: structured_extractor
    description: Whether the first substantive explanatory unit is a formula/constraint statement or a concrete example.

scorer:
  primary_type: structured_rubric
  checks:
    - id: chk.formula_first
      kind: positive
      type: structured_rubric
      weight: 0.30
      description: The first substantive explanatory unit is a formula or constraint statement; any concrete example comes after it.
      evidence_state_ids: [state.user.explanation_style]
      spec: { rubric_item: "Does the answer state a formula, definition-as-constraint, or compact rule BEFORE giving any concrete example or anecdote?", scale: binary }
    - id: chk.orthogonal_dimensions
      kind: positive
      type: structured_rubric
      weight: 0.30
      description: Explicitly states salience (importance/usefulness) and confidence (certainty/trust) are independent dimensions; high confidence does not imply high importance.
      evidence_state_ids: [state.user.misconception.salience_confidence]
      spec: { rubric_item: "Does the answer explicitly say that importance/usefulness and certainty/trust are separate and that one does not imply the other?", scale: binary }
    - id: chk.targets_prior_belief
      kind: positive
      type: structured_rubric
      weight: 0.15
      description: Directly addresses the belief that confidence means "how much the memory matters".
      evidence_state_ids: [state.user.misconception.salience_confidence]
      spec: { rubric_item: "Does the answer explicitly name and correct the idea that confidence measures how much a memory matters?", scale: binary }
    - id: chk.ranking_roles
      kind: positive
      type: structured_rubric
      weight: 0.15
      description: Says how each dimension enters ranking (salience as a ranking weight; confidence as a gate, discount, or presentation qualifier) without contradiction.
      spec: { rubric_item: "Does the answer assign a distinct, non-contradictory role in recall ranking to each of the two dimensions?", scale: binary }
    - id: chk.no_embedding_reteach
      kind: positive
      type: structured_rubric
      weight: 0.10
      description: Does not spend more than one sentence re-explaining embeddings or cosine similarity.
      evidence_state_ids: [state.user.knowledge.embeddings]
      spec: { rubric_item: "Is the explanation of embeddings/cosine similarity absent or limited to at most one sentence?", scale: binary }
    - id: chk.project_leak
      kind: violation
      type: deterministic_validator
      weight: 0.20
      description: Project-local or noise surface terms appear in a learning answer.
      evidence_state_ids: [state.project_a.stack, state.project_a.race_condition_hypothesis, state.third_party.mentor_prefers_rust]
      spec: { validator: regex_present, target: output_text, patterns: ["\\bpnpm\\b", "\\bvitest\\b", "\\beslint\\b", "\\bsqlite\\b", "okafor", "\\brust\\b", "lattice-audit"] }
    - id: chk.ephemeral_as_trait
      kind: violation
      type: structured_rubric
      weight: 0.10
      description: Treats the user as currently tired or as someone who always wants very short answers.
      evidence_state_ids: [state.user.tired_today]
      spec: { rubric_item: "Does the answer assume the user is tired, exhausted, or generally wants answers kept minimal because of fatigue?", scale: binary }
    - id: chk.word_limit
      kind: violation
      type: deterministic_validator
      weight: 0.10
      description: More than 330 words (10% tolerance over the requested 300).
      spec: { validator: word_count_max, value: 330 }

leakage_guard:
  forbidden_surface_terms: [pnpm, vitest, eslint, sqlite, okafor, rust, lattice-audit, "lattice-sync", exhausted]
  allow_terms_in_quotes: false

notes: >
  Shared latent state: explanation_style was rendered in learning and conversation sessions;
  misconception was rendered in learning sessions. Both transfer to a learning target by declaration.
  A no-memory reader can produce a correct generic explanation but will not (a) choose formula-first
  reliably, (b) target the user's specific conflation, (c) skip embeddings. Oracle-minimal should
  therefore lift the rubric substantially; certification must confirm this.
