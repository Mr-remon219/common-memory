  - id: state.project_a.no_default_export
    class: domain_local
    content: "lattice-core forbids `export default`; every module uses named exports only (enforced by an ESLint rule)."
    scope: project:lattice-core
    valid_from: day-4
    valid_to: null
    status: current
    epistemic_status: verified
    attribution: user
    transferability: { coding: true, project_building: false, learning: false, conversation: false }

  - id: state.project_a.conflict_policy_supersession
    class: domain_local
    content: "Since ADR-002, lattice-core resolves conflicting preference records by supersession: the newer record is current and the older record is kept but marked `superseded_by` pointing at the newer one. Both records are retained."
    scope: project:lattice-core
    valid_from: day-18
    valid_to: null
    status: current
    epistemic_status: verified
    attribution: user
    supersedes: [state.project_a.conflict_policy_append_only]
    transferability: { coding: true, project_building: true, learning: false, conversation: false }

  - id: state.project_a.lesson.similarity_notability
    class: domain_local
    content: "In lattice-core, deciding notability with a single scalar signal (semantic similarity to existing notes) admitted large amounts of runtime log noise. The fix that worked: require an explicit user-intent signal OR the same content recurring in >= 2 sessions. Lesson: a single scalar score is not a sufficient admission criterion."
    scope: project:lattice-core
    valid_from: day-10
    valid_to: null
    status: current
    epistemic_status: verified
    attribution: user
    transferability: { coding: true, project_building: true, learning: true, conversation: false }
    notes: "Negative experience with applicability boundary; transfers as a principle, not as a rule."

  - id: state.project_b.append_only
    class: domain_local
    content: "Project B 'lattice-audit' must be strictly append-only for audit reasons: no in-place mutation of stored records, no fields on old records may be changed after write (so no `superseded_by` back-pointers). Corrections are expressed as new correction records."
    scope: project:lattice-audit
    valid_from: day-15
    valid_to: null
    status: current
    epistemic_status: verified
    attribution: user
    transferability: { coding: true, project_building: true, learning: false, conversation: false }

