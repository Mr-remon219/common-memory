  # ---------------------------------------------------------------- s01 · day-1 · conversation / project
  - { id: ev.s01_01, session_id: s01, seq: 1, day: day-1, role: system_note, domain_hint: conversation,
      content: "New session started. Workspace: none." }
  - { id: ev.s01_02, session_id: s01, seq: 2, day: day-1, role: user, domain_hint: conversation,
      content: "Quick intro so you have context. I'm a grad student; my thesis project is LatticeNote, a local-first note-memory tool. It's due next spring. The main code lives in a repo called lattice-core (TypeScript). My advisor is Dr. Okafor." }
  - { id: ev.s01_03, session_id: s01, seq: 3, day: day-1, role: assistant, domain_hint: conversation,
      content: "Got it. Local-first note-memory tool, TypeScript in lattice-core, thesis deadline next spring, advisor Dr. Okafor. What are you working on this week?" }
  - { id: ev.s01_04, session_id: s01, seq: 4, day: day-1, role: user, domain_hint: conversation,
      content: "Getting the test setup right. We're on Jest right now but I keep fighting ESM config. Package manager is pnpm." }

  # ---------------------------------------------------------------- s02 · day-2 · learning
  - { id: ev.s02_01, session_id: s02, seq: 1, day: day-2, role: system_note, domain_hint: learning,
      content: "New session started. Workspace: none." }
  - { id: ev.s02_02, session_id: s02, seq: 2, day: day-2, role: user, domain_hint: learning,
      content: "Can you explain how embedding similarity works? Actually, let me check myself first: an embedding maps text to a vector; cosine similarity is dot(a,b)/(|a||b|), so it's the angle between vectors, range -1..1, and two paraphrases should land close to 1. Is that right?" }
  - { id: ev.s02_03, session_id: s02, seq: 3, day: day-2, role: assistant, domain_hint: learning,
      content: "That's correct. Cosine similarity ignores magnitude and only compares direction, which is why it is preferred over raw dot product for text embeddings of varying length. Want an example with actual vectors?" }
  - { id: ev.s02_04, session_id: s02, seq: 4, day: day-2, role: user, domain_hint: learning,
      content: "Not yet. One general thing about how I like explanations: when something is abstract, give me the formula or the constraint first, one or two lines, and only then an example. Examples first just confuse me because I don't know what they're examples of." }
  - { id: ev.s02_05, session_id: s02, seq: 5, day: day-2, role: assistant, domain_hint: learning,
      content: "Understood: formula or constraint first, then a concrete example. I'll follow that." }

  # ---------------------------------------------------------------- s03 · day-4 · coding
  - { id: ev.s03_01, session_id: s03, seq: 1, day: day-4, role: system_note, domain_hint: coding,
