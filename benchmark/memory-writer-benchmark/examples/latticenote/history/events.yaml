  - { id: ev.s03_04, session_id: s03, seq: 4, day: day-4, role: tool, tool_name: shell, domain_hint: coding,
      content: "$ pnpm install\nProgress: resolved 412, reused 398, downloaded 14, added 14\nPackages: +14\n++++++++++++++\nDone in 6.2s" }
  - { id: ev.s03_05, session_id: s03, seq: 5, day: day-4, role: tool, tool_name: shell, domain_hint: coding,
      content: "$ pnpm test\n RUN  v3.2.0\n ✓ src/store/notes.test.ts (12 tests) 88ms\n ✓ src/index/fts.test.ts (7 tests) 41ms\n Test Files  2 passed (2)\n      Tests  19 passed (19)" }
  - { id: ev.s03_06, session_id: s03, seq: 6, day: day-4, role: user, domain_hint: coding,
      content: "Good. Also add the ESLint rule that bans `export default` everywhere in lattice-core. Named exports only — default exports keep breaking our re-export barrels." }
  - { id: ev.s03_07, session_id: s03, seq: 7, day: day-4, role: file_change, path: eslint.config.js, domain_hint: coding,
      content: "+ rules: {\n+   'import/no-default-export': 'error',\n+ }" }
  - { id: ev.s03_08, session_id: s03, seq: 8, day: day-4, role: assistant, domain_hint: coding,
      content: "Done: lattice-core now runs Vitest via `pnpm test`, and `import/no-default-export` is an error project-wide." }

  # ---------------------------------------------------------------- s04 · day-5 · project building
  - { id: ev.s04_01, session_id: s04, seq: 1, day: day-5, role: system_note, domain_hint: project_building,
      content: "New session started. Workspace: lattice-core." }
  - { id: ev.s04_02, session_id: s04, seq: 2, day: day-5, role: user, domain_hint: project_building,
      content: "Design question. When a user's preference changes (say 'dark mode' then later 'light mode'), how should lattice-core store the two preference records? I'm leaning append-only: just keep writing records, never touch old ones, and let the reader figure out which is latest by timestamp." }
  - { id: ev.s04_03, session_id: s04, seq: 3, day: day-5, role: assistant, domain_hint: project_building,
      content: "Append-only is simple and keeps full history. The risk is that 'latest by timestamp' becomes ambiguous when records are partial or arrive out of order. Do you want me to draft an ADR?" }
  - { id: ev.s04_04, session_id: s04, seq: 4, day: day-5, role: user, domain_hint: project_building,
      content: "Yes, ADR-001: preference memory is append-only, readers infer currentness. We'll revisit if it hurts." }
  - { id: ev.s04_05, session_id: s04, seq: 5, day: day-5, role: file_change, path: docs/adr/ADR-001-preference-append-only.md, domain_hint: project_building,
      content: "# ADR-001: Preference records are append-only\nStatus: Accepted (day-5)\nDecision: conflicting preference records are appended; no record is modified; readers infer the current value from timestamps." }

  # ---------------------------------------------------------------- s05 · day-8 · learning
  - { id: ev.s05_01, session_id: s05, seq: 1, day: day-8, role: system_note, domain_hint: learning,
      content: "New session started. Workspace: none." }
  - { id: ev.s05_02, session_id: s05, seq: 2, day: day-8, role: user, domain_hint: learning,
      content: "Reading about memory systems. So every memory has a confidence score, and high-confidence memories are the important ones that should get recalled first, right? Confidence is basically how much the memory matters." }
  - { id: ev.s05_03, session_id: s05, seq: 3, day: day-8, role: assistant, domain_hint: learning,
      content: "Not quite — those are two different things, but let's park that; you asked earlier for the reading list first. Here are three papers on memory consolidation..." }
  - { id: ev.s05_04, session_id: s05, seq: 4, day: day-8, role: user, domain_hint: learning,
      content: "Ok, I'll go through them. Let's come back to the confidence thing another time." }

  # ---------------------------------------------------------------- s06 · day-10 · coding
  - { id: ev.s06_01, session_id: s06, seq: 1, day: day-10, role: system_note, domain_hint: coding,
      content: "New session started. Workspace: lattice-core." }
  - { id: ev.s06_02, session_id: s06, seq: 2, day: day-10, role: user, domain_hint: coding,
      content: "The notability filter is broken. I made it 'admit a note if its embedding similarity to any existing note is below 0.85' — meaning it's new information. Result: the store is full of pnpm progress bars and stack traces, because those are all 'new'." }
  - { id: ev.s06_03, session_id: s06, seq: 3, day: day-10, role: tool, tool_name: shell, domain_hint: coding,
      content: "$ pnpm test\n RUN  v3.2.0\n ✗ src/notability/filter.test.ts > rejects runtime noise\n   expected 0 admitted, got 37\n Test Files  1 failed | 2 passed (3)" }
  - { id: ev.s06_04, session_id: s06, seq: 4, day: day-10, role: assistant, domain_hint: coding,
      content: "Similarity alone only measures novelty, not value; noise is maximally novel. Options: (a) require an explicit user-intent signal (the user asked to remember it / it's a stated preference), or (b) require the same content to recur across at least two sessions. Or both, OR-ed." }
  - { id: ev.s06_05, session_id: s06, seq: 5, day: day-10, role: user, domain_hint: coding,
      content: "Do (a) OR (b). And before you tell me it's fixed: what test proves it? I want the existing failing test plus a new one where a repeated fact across two sessions IS admitted." }
  - { id: ev.s06_06, session_id: s06, seq: 6, day: day-10, role: file_change, path: src/notability/filter.ts, domain_hint: coding,
      content: "- export function isNotable(sim: number) { return sim < 0.85; }\n+ export function isNotable(input: NotabilityInput): boolean {\n+   return input.explicitIntent || input.recurrenceSessions >= 2;\n+ }" }
  - { id: ev.s06_07, session_id: s06, seq: 7, day: day-10, role: tool, tool_name: shell, domain_hint: coding,
      content: "$ pnpm test\n RUN  v3.2.0\n ✓ src/notability/filter.test.ts (4 tests) 22ms\n Test Files  3 passed (3)\n      Tests  25 passed (25)" }
  - { id: ev.s06_08, session_id: s06, seq: 8, day: day-10, role: user, domain_hint: coding,
      content: "Good. Note for myself: one scalar score is never enough for admission decisions. I'll keep getting burned by that." }

  # ---------------------------------------------------------------- s07 · day-12 · conversation
  - { id: ev.s07_01, session_id: s07, seq: 1, day: day-12, role: system_note, domain_hint: conversation,
      content: "New session started. Workspace: none." }
  - { id: ev.s07_02, session_id: s07, seq: 2, day: day-12, role: user, domain_hint: conversation,
      content: "Met Dr. Okafor today. He spent twenty minutes telling me lattice-core should be rewritten in Rust because he loves Rust. That's his preference, not mine; I'm staying on TypeScript. Also he explains everything by starting with a long story, which drives me crazy — I need the definition up front, then the story." }
  - { id: ev.s07_03, session_id: s07, seq: 3, day: day-12, role: assistant, domain_hint: conversation,
      content: "Noted — the Rust rewrite is your advisor's preference and you're declining it. And yes, your style is definition/formula first, story second." }
  - { id: ev.s07_04, session_id: s07, seq: 4, day: day-12, role: user, domain_hint: conversation,
      content: "Unrelated: one test in lattice-core is flaky, passes 9 times out of 10. Any quick Vitest trick?" }
  - { id: ev.s07_05, session_id: s07, seq: 5, day: day-12, role: assistant, domain_hint: conversation,
      content: "You can wrap it with `vi.retryFlaky(3)` which re-runs the test up to three times before reporting failure." }
  - { id: ev.s07_06, session_id: s07, seq: 6, day: day-12, role: user, domain_hint: conversation,
      content: "I just searched the Vitest docs and the source — there is no `vi.retryFlaky`. You made that up. There's a `retry` option in test config, which is different. Please don't invent APIs." }
  - { id: ev.s07_07, session_id: s07, seq: 7, day: day-12, role: assistant, domain_hint: conversation,
      content: "You're right, I apologize. `vi.retryFlaky` does not exist. The real mechanism is the `retry` test option." }

  # ---------------------------------------------------------------- s08 · day-15 · project building (Project B)
  - { id: ev.s08_01, session_id: s08, seq: 1, day: day-15, role: system_note, domain_hint: project_building,
      content: "New session started. Workspace: lattice-audit." }
  - { id: ev.s08_02, session_id: s08, seq: 2, day: day-15, role: user, domain_hint: project_building,
      content: "Second repo: lattice-audit. It stores the audit trail of what LatticeNote did with a user's data — the department's ethics board reviews it. Hard requirement from them: strictly append-only. Nothing already written may ever be modified, not even adding a field to an old record. If something was wrong, we append a correction record that references the old one." }
  - { id: ev.s08_03, session_id: s08, seq: 3, day: day-15, role: assistant, domain_hint: project_building,
      content: "Understood: lattice-audit is immutable-append-only; corrections are new records that reference prior ones; no back-pointers written onto old records." }
  - { id: ev.s08_04, session_id: s08, seq: 4, day: day-15, role: user, domain_hint: project_building,
      content: "Exactly. Different rules from lattice-core; don't mix them up." }

  # ---------------------------------------------------------------- s09 · day-18 · project building (ADR-002)
  - { id: ev.s09_01, session_id: s09, seq: 1, day: day-18, role: system_note, domain_hint: project_building,
      content: "New session started. Workspace: lattice-core." }
  - { id: ev.s09_02, session_id: s09, seq: 2, day: day-18, role: user, domain_hint: project_building,
      content: "ADR-001 hurt. Two weeks of append-only preference records and every reader re-implements 'which one is current' slightly differently; we shipped a bug where dark mode came back. I'm reversing it." }
  - { id: ev.s09_03, session_id: s09, seq: 3, day: day-18, role: assistant, domain_hint: project_building,
      content: "Options: (1) in-place overwrite, losing history; (2) supersession: keep both records, mark the older one `superseded_by: <newer id>` so currentness is explicit; (3) keep append-only but add a materialized 'current' view." }
  - { id: ev.s09_04, session_id: s09, seq: 4, day: day-18, role: user, domain_hint: project_building,
      content: "Supersession. Keep both records, the old one gets `superseded_by`, the newer one is current. That's ADR-002 and it supersedes ADR-001. To be explicit: this applies to lattice-core only. lattice-audit stays append-only because the ethics board requires it." }
  - { id: ev.s09_05, session_id: s09, seq: 5, day: day-18, role: file_change, path: docs/adr/ADR-002-preference-supersession.md, domain_hint: project_building,
      content: "# ADR-002: Preference records use supersession\nStatus: Accepted (day-18). Supersedes ADR-001.\nDecision: when a preference record conflicts with an existing one, the new record becomes current and the older record is retained with `superseded_by` set to the new record id. Scope: lattice-core only." }
  - { id: ev.s09_06, session_id: s09, seq: 6, day: day-18, role: file_change, path: docs/adr/ADR-001-preference-append-only.md, domain_hint: project_building,
      content: "- Status: Accepted (day-5)\n+ Status: Superseded by ADR-002 (day-18)" }

