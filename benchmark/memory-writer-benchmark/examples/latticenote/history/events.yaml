  - { id: ev.s10_01, session_id: s10, seq: 1, day: day-20, role: system_note, domain_hint: coding,
      content: "New session started. Workspace: lattice-core." }
  - { id: ev.s10_02, session_id: s10, seq: 2, day: day-20, role: user, domain_hint: coding,
