      content: "$ pnpm test\n RUN  v3.2.0\n ✓ src/store/notes.test.ts (12 tests)\n ✗ src/store/wal.test.ts > concurrent writers (flaky)\n Test Files  1 failed | 3 passed (4)" }

  # ---------------------------------------------------------------- s11 · day-22 · learning (tired, demo prep)
  - { id: ev.s11_01, session_id: s11, seq: 1, day: day-22, role: system_note, domain_hint: learning,
      content: "New session started. Workspace: none." }
  - { id: ev.s11_02, session_id: s11, seq: 2, day: day-22, role: user, domain_hint: learning,
      content: "I'm exhausted today, keep everything short. Demo for Dr. Okafor is on day 25, I need to be able to explain how memory recall ranks things. Give me the ranking rule as a one-line formula first, then one example — the usual way." }
  - { id: ev.s11_03, session_id: s11, seq: 3, day: day-22, role: assistant, domain_hint: learning,
      content: "score = w1·similarity(query, memory) + w2·recency + w3·salience. Example: a note from yesterday that closely matches the query beats a highly relevant note from last year." }
  - { id: ev.s11_04, session_id: s11, seq: 4, day: day-22, role: user, domain_hint: learning,
      content: "Where's confidence in that formula? I'd have put confidence where you put salience — high confidence means the memory matters more." }
  - { id: ev.s11_05, session_id: s11, seq: 5, day: day-22, role: assistant, domain_hint: learning,
      content: "They're separate dimensions; we can dig into that after the demo since you asked to keep it short today." }
  - { id: ev.s11_06, session_id: s11, seq: 6, day: day-22, role: user, domain_hint: learning,
      content: "Fine, after the demo." }

